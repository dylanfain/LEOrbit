<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Satellite Analytics Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <style>
        :root {
            --accent: #7eb8ff;

            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.65);

            --panel-bg: rgba(10, 10, 20, 0.85);

            --border: 1px solid rgba(100, 150, 255, 0.3);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

            --r-md: 12px;

            --pad: 16px;

            --fs-11: 11px;
            --fs-12: 12px;
            --fs-13: 13px;

            --lh-tight: 1.15;
            --lh: 1.28;

            --page-pad: 20px;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            background: black;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            overflow-x: hidden;
            overflow-y: auto;
        }

        #star-background {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .page-shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 14px var(--page-pad) var(--page-pad);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #top-tabs {
            position: sticky;
            top: 14px;
            align-self: center;
            display: flex;
            gap: 12px;
            z-index: 30;
            width: fit-content;
        }

        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(30, 60, 120, 0.6);
            color: #cfe4ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            line-height: var(--lh-tight);
        }
        .tab:hover { background: rgba(80, 140, 255, 0.8); color: #fff; }
        .tab.active { background: rgba(80, 140, 255, 1); color: #fff; }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 16px;
            z-index: 20;
        }

        #ui-panel {
            background: var(--panel-bg);
            border: var(--border);
            border-radius: var(--r-md);
            padding: var(--pad);
            min-width: min(100%, 280px);
            max-width: min(100%, 420px);
            flex: 1 1 320px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);

            overflow: hidden;
            font-size: var(--fs-13);
            line-height: var(--lh);
        }

        #ui-panel h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            font-weight: 650;
            color: var(--accent);
            line-height: var(--lh-tight);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            gap: 12px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: var(--fs-12);
            line-height: var(--lh-tight);
            white-space: nowrap;

            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 750;
            line-height: var(--lh-tight);
            white-space: nowrap;
            flex: 0 0 auto;
            text-align: right;
        }

        .stat-label.stat-route {
            font-size: 14px;
            font-weight: 650;
            flex: 1 1 auto;
        }

        .view-toggle {
            display: inline-flex;
            background: rgba(30, 60, 120, 0.35);
            border: 1px solid rgba(100, 150, 255, 0.25);
            border-radius: 16px;
            padding: 3px;
            flex: 0 0 auto;
            align-self: flex-end;
            max-width: 100%;
        }

        .view-btn {
            padding: 8px 16px;
            border-radius: 13px;
            background: transparent;
            color: #cfe4ff;
            border: none;
            cursor: pointer;
            font-size: var(--fs-12);
            font-weight: 750;
            transition: all 0.15s ease;
            white-space: nowrap;
            line-height: var(--lh-tight);
        }

        .view-btn:hover { background: rgba(100, 150, 255, 0.15); color: #fff; }
        .view-btn.active { background: rgba(80, 140, 255, 1); color: #fff; }

        .main-content {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            z-index: 10;
        }

        .views-shell {
            flex: 1;
            min-height: 0;
            min-width: 0;
            min-height: clamp(420px, calc(100vh - 230px), 900px);
            background: rgba(30, 60, 120, 0.28);
            border-radius: 18px;
            border: 1px solid rgba(100, 150, 255, 0.22);
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .dash-body { flex: 1; min-height: 0; }

        #panel-view, #graph-view {
            height: 100%;
            display: none;
            position: relative;
        }

        #algo-panels {
            height: 100%;
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            align-items: stretch;
            overflow: auto;
            padding-right: 2px;
            box-sizing: border-box;
        }

        .algo-panel {
            background: rgba(20, 45, 95, 0.52);
            border: 1px solid rgba(100, 150, 255, 0.18);
            border-radius: 18px;
            padding: 14px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .algo-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .algo-panel-title {
            color: rgba(207, 228, 255, 0.9);
            font-weight: 800;
            font-size: var(--fs-12);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            line-height: var(--lh-tight);
        }

        .algo-panel-hint {
            color: rgba(207, 228, 255, 0.6);
            font-size: 14px;
            user-select: none;
            cursor: help;
            padding: 4px 6px;
            border-radius: 10px;
        }
        .algo-panel-hint:hover {
            background: rgba(126, 184, 255, 0.10);
            color: rgba(207, 228, 255, 0.92);
        }
        .algo-panel-hint:focus-visible {
            outline: 2px solid rgba(126, 184, 255, 0.8);
            outline-offset: 2px;
        }

        .metric-tiles {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
        }

        .metric-tile {
            background: rgba(5, 10, 40, 0.72);
            border: 1px solid rgba(120, 170, 255, 0.14);
            border-radius: 14px;
            padding: 10px 12px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            min-height: 110px;
        }

        .metric-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            background: var(--accent);
        }

        .metric-tile-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .metric-tile-label {
            font-size: var(--fs-11);
            font-weight: 800;
            color: rgba(207, 228, 255, 0.92);
            line-height: var(--lh-tight);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-tile-sub {
            font-size: var(--fs-11);
            font-weight: 650;
            color: rgba(207, 228, 255, 0.55);
            line-height: var(--lh-tight);
        }

        .metric-tile-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: clamp(20px, 3vw, 24px);
            font-weight: 850;
            color: rgba(207, 228, 255, 0.95);
            line-height: var(--lh-tight);
            text-align: right;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .graph-grid {
            height: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            overflow: hidden;
            align-content: stretch;
        }

        .graph-card {
            background: rgba(20, 45, 95, 0.52);
            border: 1px solid rgba(100, 150, 255, 0.18);
            border-radius: 18px;
            padding: 14px 14px 12px 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .graph-card-title {
            color: rgba(207, 228, 255, 0.9);
            font-weight: 800;
            font-size: var(--fs-12);
            margin: 0 0 6px 0;
            letter-spacing: 0.6px;
            line-height: var(--lh-tight);
            text-transform: uppercase;
        }

        .graph-card-sub {
            margin: 0 0 8px 0;
            color: rgba(207, 228, 255, 0.55);
            font-size: var(--fs-12);
            font-weight: 650;
            line-height: var(--lh-tight);
        }

        .graph-canvas-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            border-radius: 16px;
            background: rgba(5, 10, 40, 0.55);
            border: 1px solid rgba(120, 170, 255, 0.12);
            overflow: hidden;
            padding: 8px;
        }

        .graph-canvas-wrap canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .view-loader-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 10, 40, 0.55);
            border-radius: 14px;
            z-index: 20;
            backdrop-filter: blur(2px);
            pointer-events: none;
        }

        .inline-loader {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(207, 228, 255, 0.85);
            font-weight: 750;
            font-size: var(--fs-12);
            white-space: nowrap;
            line-height: var(--lh-tight);
        }

        .inline-loader-spinner {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            border: 2px solid rgba(126, 184, 255, 0.25);
            border-top-color: rgba(126, 184, 255, 0.95);
            animation: spin 0.85s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #algo-panels::-webkit-scrollbar { width: 6px; }
        #algo-panels::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 3px; }
        #algo-panels::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
        #algo-panels::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        #algo-tooltip {
            position: fixed;
            z-index: 9999;
            display: none;

            max-width: 260px;
            padding: 10px 12px;
            border-radius: 12px;

            background: rgba(10, 10, 20, 0.95);
            border: 1px solid rgba(126, 184, 255, 0.45);
            color: rgba(207, 228, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

            font-size: 12px;
            line-height: 1.3;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        @media (max-width: 900px) {
            :root {
                --page-pad: 10px;
            }

            #top-tabs {
                top: 10px;
                gap: 8px;
            }

            .tab {
                padding: 7px 12px;
                font-size: 12px;
            }

            .top-row {
                gap: 10px;
            }

            #ui-panel {
                max-width: none;
            }

            .view-toggle {
                align-self: stretch;
                justify-content: center;
            }

            .graph-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .page-shell {
                gap: 14px;
            }

            .views-shell {
                min-height: 0;
                padding: 12px;
            }

            .metric-tiles {
                grid-template-columns: 1fr;
            }

            .metric-tile {
                min-height: 88px;
            }

            .graph-canvas-wrap {
                min-height: 220px;
            }
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
          }
        }
    </script>
</head>

<body>
<div id="star-background"></div>
<div class="page-shell">

<div id="top-tabs">
    <a href="index.html" class="tab">Satellite Visualizer</a>
    <a href="analytics.html" class="tab active">Analytics</a>
</div>

<div class="top-row">
    <div id="ui-panel">
        <h2>Analytics</h2>
        <div id="active-route-display">
            <div class="stat-row">
                <span class="stat-label stat-route">—</span>
                <span class="stat-value">-</span>
            </div>
        </div>
    </div>

    <div class="view-toggle" role="tablist" aria-label="Dashboard view">
        <button id="graph-view-btn" class="view-btn" type="button" aria-selected="false">Graph View</button>
        <button id="panel-view-btn" class="view-btn active" type="button" aria-selected="true">Panel View</button>
    </div>
</div>

<div class="main-content">
    <div class="views-shell">
        <div class="dash-body">
            <div id="panel-view">
                <div id="panel-loader" class="view-loader-overlay"></div>
                <div id="algo-panels"></div>
            </div>

            <div id="graph-view">
                <div id="graph-loader" class="view-loader-overlay"></div>

                <div class="graph-grid">
                    <div class="graph-card">
                        <div class="graph-card-title">Hop Count</div>
                        <div class="graph-card-sub">Lower is better</div>
                        <div class="graph-canvas-wrap"><canvas id="chart-hops"></canvas></div>
                    </div>
                    <div class="graph-card">
                        <div class="graph-card-title">Avg Latency</div>
                        <div class="graph-card-sub">Lower is better (ms)</div>
                        <div class="graph-canvas-wrap"><canvas id="chart-latency"></canvas></div>
                    </div>
                    <div class="graph-card">
                        <div class="graph-card-title">Bandwidth Usage</div>
                        <div class="graph-card-sub">Lower is better (%)</div>
                        <div class="graph-canvas-wrap"><canvas id="chart-bandwidth"></canvas></div>
                    </div>
                    <div class="graph-card">
                        <div class="graph-card-title">Path Efficiency</div>
                        <div class="graph-card-sub">Higher is better (%)</div>
                        <div class="graph-canvas-wrap"><canvas id="chart-efficiency"></canvas></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</div>

<div id="algo-tooltip" role="tooltip" aria-hidden="true"></div>

<script type="module">
    import { initStarBackground } from "./js/starfield.js";
    initStarBackground(document.getElementById("star-background"));
</script>

<script type="module" src="js/analytics.js"></script>
</body>
</html>

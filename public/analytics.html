<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Satellite Analytics Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: black;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #star-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        /* control panel */
        #ui-panel {
            width: 320px;
            background: rgba(10, 10, 20, 0.85);
            border-right: 1px solid rgba(100, 150, 255, 0.3);
            padding: 30px 25px;
            backdrop-filter: blur(10px);
            box-shadow: 8px 0 32px rgba(0, 0, 0, 0.4);
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* panel header */
        #ui-panel h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: 600;
            color: #7eb8ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .route-info-badge {
            font-size: 12px;
            background: rgba(126, 184, 255, 0.1);
            border: 1px solid rgba(126, 184, 255, 0.3);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #cfe4ff;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* navigation tabs */
        #top-tabs {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 30;
        }
        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(30, 60, 120, 0.6);
            color: #cfe4ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .tab.active {
            background: rgba(80, 140, 255, 1);
            color: #fff;
        }
        .control-group {
            margin-top: 20px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .toggle-button {
            display: inline-block;
            padding: 8px 16px;
            margin: 4px 2px;
            border-radius: 12px;
            background: rgba(30, 60, 120, 0.6);
            color: #cfe4ff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
            transition: all 0.2s;
        }
        .toggle-button.active {
            background: rgba(80, 140, 255, 1);
            color: #fff;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-group label {
            text-transform: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        #written-analytics {
            display: none;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            max-height: 40%;
            overflow-y: auto;
        }
        .algo-block {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .algo-name {
            color: #7eb8ff;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            text-decoration: underline;
        }
        .metric-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 2px 0;
            color: #cfe4ff;
        }
        .dashboard {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 20px 20px;
        }
        .chart-container {
            width: 90%;
            height: 75%;
            background: rgba(30, 60, 120, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .chart-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .chart-header h3 {
            margin: 0;
            font-size: 24px;
            color: #7eb8ff;
            font-weight: 600;
        }
        .chart-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        #metricsChart {
            position: absolute !important;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }
        .chart-type-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .chart-type-btn {
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(30, 60, 120, 0.6);
            color: #cfe4ff;
            cursor: pointer;
            font-size: 12px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            transition: all 0.2s;
        }
        .chart-type-btn.active {
            background: rgba(80, 140, 255, 1);
            color: #fff;
        }
        .checkbox-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-control label {
            margin: 0;
            cursor: pointer;
        }

        .checkbox-control input[type="checkbox"] {
            cursor: pointer;
        }
    </style>
    <!-- import map for Three.js -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
          }
        }
    </script>
</head>
<body>
<div id="star-background"></div>
<div class="app-container">
    <!-- Left sidebar control panel -->
    <div id="ui-panel">
        <h2>📡 Routing Analytics</h2>
        <!-- Active route information display -->
        <div id="active-route-display" class="route-info-badge">
            No active route selected.
        </div>
        <!-- Algorithm selection toggles -->
        <div class="control-group">
            <label>Select Algorithms</label>
            <div>
                <span class="toggle-button active" data-algo="shortest-path">Shortest Path</span>
                <span class="toggle-button" data-algo="minimum-latency">Minimum Latency</span>
                <span class="toggle-button" data-algo="load-balanced">Load Balanced</span>
            </div>
        </div>
        <!-- Metric selection radio buttons -->
        <div class="control-group">
            <label>Select Metric to Chart</label>
            <div class="radio-group">
                <label><input type="radio" name="metric" value="Hops" checked> Hop Count</label>
                <label><input type="radio" name="metric" value="Latency"> Avg Latency (ms)</label>
                <label><input type="radio" name="metric" value="Bandwidth"> Bandwfidth Usage (%)</label>
            </div>
        </div>
        <!-- Toggle for written analytics display -->
        <div class="control-group checkbox-control">
            <input type="checkbox" id="show-summary">
            <label for="show-summary">Show Written Analytics</label>
        </div>
        <!-- Additional metrics selection (shown when single algorithm selected) -->
        <div class="control-group">
            <label>Select Additional Metrics</label>
            <div class="radio-group">
                <label><input type="checkbox" name="extra-metrics" value="Hops"> Hops</label>
                <label><input type="checkbox" name="extra-metrics" value="Latency"> Latency</label>
                <label><input type="checkbox" name="extra-metrics" value="Bandwidth"> Bandwidth</label>
            </div>
        </div>
        <!-- Written analytics container (populated dynamically) -->
        <div id="written-analytics"></div>
    </div>

    <!-- Right side main content area -->
    <div class="main-content">
        <div id="top-tabs">
            <a href="index.html" class="tab">3D Visualization</a>
            <a href="analytics.html" class="tab active">Analytics</a>
        </div>
        <!-- Chart dashboard area -->
        <div class="dashboard">
            <div class="chart-container">
                <div class="chart-type-selector">
                    <button class="chart-type-btn active" data-type="bar">Bar Chart</button>
                    <button class="chart-type-btn" data-type="line">Line Chart</button>
                </div>
                <div class="chart-header">
                    <h3 id="chart-title">Select a route to view analytics</h3>
                </div>
                <div class="chart-wrapper">
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initStarBackground } from './js/starfield.js';
    initStarBackground(document.getElementById('star-background'));
</script>

<script type="module" src="js/analytics.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Satellite Analytics Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        html {
            background: black;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: transparent;
            overflow: hidden;
        }
        body.page-visible { opacity: 1; }

        #star-background {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
        }

        #top-tabs {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(30,60,120,0.6);
            color: #cfe4ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .tab:hover {
            background: rgba(80,140,255,0.8);
            color: #fff;
        }
        .tab.active {
            background: rgba(80,140,255,1);
            color: #fff;
        }

        #ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10,10,20,0.85);
            border: 1px solid rgba(100,150,255,0.3);
            border-radius: 12px;
            padding: 20px;
            min-width: 240px;
            color: #fff;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 20;
        }
        #ui-panel h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            font-weight: 600;
            color: #7eb8ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        #ui-panel h2 span {
            font-size: 14px;
        }
        .panel-content {
            display: block;
        }
        .control-group {
            margin-top: 15px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .toggle-button {
            display: inline-block;
            padding: 8px 16px;
            margin: 4px 2px;
            border-radius: 12px;
            background: rgba(30,60,120,0.6);
            color: #cfe4ff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
            transition: all 0.2s;
        }
        .toggle-button.active {
            background: rgba(80,140,255,1);
            color: #fff;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #written-analytics {
            display: none;
            margin-top: 8px;
            font-size: 12px;
            color: #cfe4ff;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 6px;
        }
        .algos-container {
            display: flex;
            gap: 12px;
        }
        .algos-container.vertical {
            flex-direction: column;
        }
        .algos-container.horizontal {
            flex-direction: row;
            justify-content: space-between;
        }
        .algo-block {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 4px 6px;
            text-align: center;
        }
        .algo-name {
            text-decoration: underline;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .dashboard {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 5;
            text-align: center;
        }
        .chart-placeholder {
            position: fixed;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 70vh;
            background: rgba(30, 60, 120, 0.7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 18px;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
          }
        }
    </script>
</head>
<body>

<div id="star-background"></div>

<div id="top-tabs">
    <a href="index.html" class="tab">3D Visualization</a>
    <a href="analytics.html" class="tab active">Analytics</a>
</div>

<div id="ui-panel">
    <h2>📡 Routing Analytics <span id="toggle-panel">−</span></h2>
    <div class="panel-content">
        <div class="control-group">
            <label>Select Algorithms</label>
            <div>
                <span class="toggle-button active">Shortest Path</span>
                <span class="toggle-button">Minimum Latency</span>
                <span class="toggle-button">Load Balanced</span>
            </div>
        </div>

        <div class="control-group">
            <label>Select Metric to Chart</label>
            <div class="radio-group">
                <label><input type="radio" name="metric" value="Hops" checked> Average Hops</label>
                <label><input type="radio" name="metric" value="Latency"> Avg Latency (ms)</label>
                <label><input type="radio" name="metric" value="Bandwidth"> Bandwidth Usage (%)</label>
            </div>
        </div>

        <div class="control-group">
            <label>Show Written Analytics</label>
            <input type="checkbox" id="show-summary">
            <div id="summary-note" style="font-size:10px; color:#888; margin-top:2px;">*Multiple metrics only available when a single algorithm is selected</div>
        </div>

        <div class="control-group">
            <label>Select Additional Metrics for Written Analytics</label>
            <div class="radio-group">
                <label><input type="checkbox" name="extra-metrics" value="Hops"> Hops</label>
                <label><input type="checkbox" name="extra-metrics" value="Latency"> Latency</label>
                <label><input type="checkbox" name="extra-metrics" value="Bandwidth"> Bandwidth</label>
            </div>
        </div>

        <div id="written-analytics"></div>
    </div>
</div>

<div class="dashboard">
    <div class="chart-placeholder" id="chart-placeholder">
        Chart will appear here
    </div>
</div>

<script type="module" src="analytics-stars.js"></script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('page-visible');
    });

    const panelHeader = document.querySelector('#ui-panel h2');
    const panelContent = document.querySelector('.panel-content');
    const toggleSymbol = document.querySelector('#toggle-panel');
    panelHeader.addEventListener('click', () => {
        if(panelContent.style.display === 'none') {
            panelContent.style.display = 'block';
            toggleSymbol.textContent = '−';
        } else {
            panelContent.style.display = 'none';
            toggleSymbol.textContent = '+';
        }
    });

    const algoButtons = document.querySelectorAll('.toggle-button');
    const chart = document.getElementById('chart-placeholder');
    const summaryCheckbox = document.getElementById('show-summary');
    const writtenDiv = document.getElementById('written-analytics');
    const extraMetricCheckboxes = document.querySelectorAll('input[name="extra-metrics"]');
    const metricRadios = document.querySelectorAll('input[name="metric"]');

    function updateChart() {
        const selectedAlgos = Array.from(algoButtons).filter(b => b.classList.contains('active')).map(b => b.textContent);
        const selectedMetric = document.querySelector('input[name="metric"]:checked').nextSibling.textContent;
        chart.textContent = `${selectedMetric} charted for: ${selectedAlgos.join(', ')}`;
    }

    function updateWrittenAnalytics() {
        const selectedAlgos = Array.from(algoButtons).filter(b => b.classList.contains('active')).map(b => b.textContent);
        if (!summaryCheckbox.checked) {
            writtenDiv.style.display = 'none';
            return;
        }

        let metricsToShow = [document.querySelector('input[name="metric"]:checked').value];
        if (selectedAlgos.length === 1) {
            metricsToShow = Array.from(extraMetricCheckboxes).filter(cb => cb.checked).map(cb => cb.value);
            if (!metricsToShow.includes(document.querySelector('input[name="metric"]:checked').value))
                metricsToShow.unshift(document.querySelector('input[name="metric"]:checked').value);
        }

        writtenDiv.innerHTML = '';
        const container = document.createElement('div');
        container.className = 'algos-container ' + (selectedAlgos.length > 1 ? 'horizontal' : 'vertical');

        selectedAlgos.forEach(algo => {
            const block = document.createElement('div');
            block.className = 'algo-block';
            const name = document.createElement('div');
            name.className = 'algo-name';
            name.textContent = algo;
            block.appendChild(name);
            metricsToShow.forEach(m => {
                const val = Math.floor(Math.random() * 100); // placeholder, right now all the data is random
                const metricDiv = document.createElement('div');
                metricDiv.textContent = `${m}: ${val}`;
                block.appendChild(metricDiv);
            });
            container.appendChild(block);
        });

        writtenDiv.appendChild(container);
        writtenDiv.style.display = 'block';
    }

    algoButtons.forEach(btn => btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        updateChart();
        updateWrittenAnalytics();
    }));
    metricRadios.forEach(radio => radio.addEventListener('change', () => {
        updateChart();
        updateWrittenAnalytics();
    }));
    extraMetricCheckboxes.forEach(cb => cb.addEventListener('change', updateWrittenAnalytics));
    summaryCheckbox.addEventListener('change', updateWrittenAnalytics);

    updateChart();
</script>
</body>
</html>
